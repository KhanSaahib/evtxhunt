[project]
name = "evtxhunt"
version = "0.1.0"
description = "Dependency-free Sigma-style detection and IR triage for Windows Event Log exports"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[project.scripts]
evtxhunt = "evtxhunt.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evtxhunt*"]
